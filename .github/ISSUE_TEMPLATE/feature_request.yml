name: Feature request
description: Propose a new API or a change in behavior.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Sharp.Mediator is Native AOT- and trim-safe by design and keeps the typed dispatch path allocation-free, so a proposal that needs runtime reflection or `MakeGenericType` on the dispatch path needs a design based on the source generator."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or can't do cleanly?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Sketch the code you would like to write.
      render: csharp
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
